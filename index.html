<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator Debug Practice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator">
    <h1>Tip Calculator</h1>
    <p class="intro">Enter your bill and choose a tip percentage.</p>

    <label for="bill">Bill amount</label>
    <input id="bill" type="number" min="0" step="0.01" placeholder="50.00">

    <label for="tip">Tip percentage</label>
    <select id="tip">
      <option value="15">15%</option>
      <option value="18">18%</option>
      <option value="20">20%</option>
      <option value="25">25%</option>
    </select>

    <button id="calculate">Calculate Tip</button>

    <section class="results">
      <p>Tip: <strong id="tipAmount">$0.00</strong></p>
      <p>Total: <strong id="totalAmount">$0.00</strong></p>
    </section>
  </main>

  <!-- TROUBLESHOOTING ISSUE #1 (HTML): the JavaScript filename below is wrong. -->
  <script src="calculator.js"></script>
</body>
</html>
